<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>COMPASSO</title>
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f4f1ea" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b0e13" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon.svg">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Jost:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/app.css?v=__V__">
</head>
<body>
<div class="app" id="app" hidden>
  <header class="top">
    <div class="brand"><b>COMPASSO</b><i class="pulso" id="pulso" title=""></i></div>
    <nav class="views" aria-label="Vistas">
      <button data-v="hoje" data-i="nav_today">Hoje</button><button data-v="quadro" data-i="nav_board">Quadro</button><button data-v="calendario" data-i="nav_cal">Calendário</button><button data-v="planejador" data-i="nav_chat">Planejador</button>
    </nav>
    <div class="right">
      <button class="busca-btn" id="palBtn" type="button"><span class="lupa" aria-hidden="true"></span><span data-i="search_hint">Buscar ou criar</span><kbd>Ctrl K</kbd></button>
      <button class="btn sug-btn" id="sugBtn" type="button"><span data-i="sug">Sugestões</span> <span class="count" id="sugCount">0</span></button>
      <button class="icon" id="noviBtn" type="button" aria-label="Novidades"><span class="sino" aria-hidden="true"></span><span class="ponto" id="noviCount" hidden></span></button>
      <div class="lang" role="group" aria-label="Idioma / Langue"><button data-l="pt" type="button" title="Português do Brasil">PT</button><button data-l="fr" type="button" title="Français">FR</button></div>
      <button class="icon" id="euBtn" type="button" data-i-title="logout" title="Sair"><span class="av" id="euAv"></span></button>
    </div>
  </header>

  <div class="filtros" id="filtros">
    <div class="filters" id="whoFilter"></div>
    <div class="filtro-dir" id="filtroDir"></div>
  </div>

  <main>
    <section class="view" id="v-hoje">
      <form class="rapido" id="rapido" autocomplete="off">
        <span class="mais" aria-hidden="true">+</span>
        <input id="rapidoInput" type="text" data-i-ph="quick_ph" aria-label="Nova tarefa" maxlength="300">
        <div class="previa" id="rapidoPrevia" aria-live="polite"></div>
      </form>
      <div class="dia" id="diaCab"></div>
      <div class="secoes" id="secoes"></div>
    </section>

    <section class="view" id="v-quadro">
      <div class="board" id="board"></div>
      <p class="hintline quadro-pe"><span data-i="board_hint"></span> <button class="linkbtn" id="arcBtn" type="button"><span data-i="archive_link">Arquivo</span> <span id="arcCount">0</span></button></p>
    </section>

    <section class="view" id="v-calendario">
      <div class="cal-cab">
        <div class="cal-nav"><button class="btn ghost sm" id="calPrev" type="button" data-i-title="cal_prev" aria-label="Anterior">‹</button><button class="btn sm" id="calHoje" type="button" data-i="cal_now">Hoje</button><button class="btn ghost sm" id="calNext" type="button" data-i-title="cal_next" aria-label="Próximas">›</button><h1 id="calTitulo"></h1></div>
        <span class="hintline" data-i="cal_hint"></span>
      </div>
      <div class="bandejas" id="bandejas"></div>
      <div class="grade" id="grade"></div>
      <div class="feed" id="feed"></div>
    </section>

    <section class="view" id="v-planejador">
      <div class="sub"><h1 data-i="chat_title">Diga o que precisa ser feito, ou pergunte</h1><span class="hintline" id="chatHint"></span></div>
      <div class="chatwrap">
        <div class="msgs" id="msgs" aria-live="polite"></div>
        <div class="exemplos" id="exemplos"></div>
        <form class="composer" id="composer">
          <textarea id="input" data-i-ph="chat_ph" rows="2" aria-label="Pedido"></textarea>
          <button class="btn gold" type="submit" data-i="send">Enviar</button>
        </form>
      </div>
    </section>
  </main>
  <div class="proto" id="rodape"></div>
</div>

<nav class="tabbar" id="tabbar" aria-label="Vistas" hidden>
  <button data-v="hoje" type="button"><span class="ti ti-hoje" aria-hidden="true"></span><span data-i="nav_today">Hoje</span></button>
  <button data-v="quadro" type="button"><span class="ti ti-quadro" aria-hidden="true"></span><span data-i="nav_board">Quadro</span></button>
  <button class="tab-mais" id="tabMais" type="button" aria-label="Nova tarefa"><span aria-hidden="true">+</span></button>
  <button data-v="calendario" type="button"><span class="ti ti-cal" aria-hidden="true"></span><span data-i="nav_cal">Calendário</span></button>
  <button data-v="planejador" type="button"><span class="ti ti-chat" aria-hidden="true"></span><span data-i="nav_chat">Planejador</span></button>
</nav>

<div class="login" id="login" hidden>
  <form class="login-card" id="loginForm">
    <div class="brand"><b>COMPASSO</b></div>
    <div class="lang" role="group" aria-label="Idioma / Langue"><button data-l="pt" type="button">PT</button><button data-l="fr" type="button">FR</button></div>
    <p class="hintline" data-i="login_hint">Quadro de tarefas da The World Keys. Entre com o seu usuário.</p>
    <div class="field"><label for="lUser" data-i="login_who">Quem é você</label><select id="lUser"></select></div>
    <div class="field"><label for="lPass" data-i="login_pass">Senha</label><input type="password" id="lPass" autocomplete="current-password" required></div>
    <div class="hint bad" id="lErr" role="alert"></div>
    <button class="btn gold" type="submit" data-i="login_btn">Entrar</button>
  </form>
</div>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-hidden="true" inert></aside>
<div class="paleta" id="paleta" role="dialog" aria-modal="true" hidden>
  <div class="pal-caixa">
    <input id="palInput" type="text" autocomplete="off" data-i-ph="pal_ph" aria-label="Buscar ou criar">
    <div class="pal-previa" id="palPrevia"></div>
    <div class="pal-lista" id="palLista" role="listbox"></div>
  </div>
</div>
<div class="menu" id="menu" role="menu" hidden></div>
<div class="popover" id="novi" hidden></div>
<div class="folha" id="folha" role="dialog" aria-live="polite" hidden></div>
<div class="ajuda" id="ajuda" role="dialog" aria-modal="true" hidden></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="/nucleo.js?v=__V__"></script>
<script src="/i18n.js?v=__V__"></script>
<script src="/app.js?v=__V__"></script>
</body>
</html>
