<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0b0714">
  <title>Studio · Wanted Chauffeur</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><defs><linearGradient id='g' x1='0' x2='1' y1='0' y2='1'><stop offset='0' stop-color='%238b5cf6'/><stop offset='.5' stop-color='%23ff4fa3'/><stop offset='1' stop-color='%236fd3ff'/></linearGradient></defs><rect width='32' height='32' rx='8' fill='%230b0714'/><path d='M12 9l12 7-12 7z' fill='url(%23g)'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Yellowtail&display=swap">
  <link rel="stylesheet" href="/estudio/player.css">
  <link rel="stylesheet" href="/estudio/estudio.css">
</head>
<body>
  <div class="gate" id="gate" hidden>
    <form id="gate-form">
      <p class="marca"><span>Wanted Chauffeur</span><i>Studio</i></p>
      <label for="gate-key">Chave da Central</label>
      <input id="gate-key" type="password" autocomplete="current-password" placeholder="cole a chave" required>
      <button class="btn pri" type="submit">Entrar</button>
    </form>
  </div>

  <div class="app" id="app">
    <aside class="rail" aria-label="Áreas do Studio">
      <a class="marca" href="#hoje" aria-label="Wanted Chauffeur Studio, início"><span>Wanted Chauffeur</span><i>Studio</i></a>
      <nav id="nav">
        <a href="#criar" data-v="criar"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/><path d="M19 16l.8 2.2L22 19l-2.2.8L19 22l-.8-2.2L16 19l2.2-.8z"/></svg><span>Criar</span></a>
        <a href="#hoje" data-v="hoje"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3h10a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/><path d="M10 9l5 3-5 3z"/></svg><span>Hoje</span></a>
        <a href="#lab" data-v="lab"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3v6l-5 9a2 2 0 0 0 2 3h12a2 2 0 0 0 2-3l-5-9V3"/><path d="M8 3h8M7 15h10"/></svg><span>Laboratório</span></a>
        <a href="#radar" data-v="radar"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/><path d="M12 12l6-6"/></svg><span>Radar</span></a>
        <a href="#desempenho" data-v="desempenho"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19V5M4 19h16"/><path d="M7 15l4-5 3 3 5-7"/></svg><span>Desempenho</span></a>
        <a href="#arquivo" data-v="arquivo"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="5" rx="1.5"/><path d="M5 9v9a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V9M10 13h4"/></svg><span>Arquivo</span></a>
        <a href="#sistema" data-v="sistema"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/></svg><span>Sistema</span></a>
      </nav>
      <div class="rail-pe">
        <span class="ia" id="ia-pill" data-s="?"><i></i><b>lendo…</b></span>
        <a class="btn mini" href="/chauffeur">Pedidos de corrida</a>
        <a class="btn mini" href="/">← Central de Comando</a>
      </div>
    </aside>

    <div class="palco">
      <header class="topo">
        <a class="btn mini volta" href="/" title="Voltar à Central de Comando"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>Central</a>
        <div class="dia" id="dia-nav" hidden>
          <button class="ic" id="dia-ant" type="button" aria-label="Dia anterior"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
          <div><b id="dia-t">—</b><span id="dia-s"></span></div>
          <button class="ic" id="dia-prox" type="button" aria-label="Dia seguinte"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>
        </div>
        <h1 class="topo-t" id="topo-t"></h1>
        <div class="topo-acoes">
          <button class="btn" id="btn-link" type="button" hidden>Link do Julien</button>
          <button class="btn pri" id="btn-gerar" type="button">Gerar pacote</button>
        </div>
      </header>
      <div class="progresso" id="progresso" hidden></div>
      <main id="view" tabindex="-1"></main>
    </div>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="/estudio/player.js"></script>
  <script src="/estudio/render-canvas.js"></script>
  <script src="/estudio/criar.js"></script>
  <script src="/estudio/estudio.js"></script>
</body>
</html>
