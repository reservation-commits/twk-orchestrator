[phases.setup]
nixPkgs = ["nodejs_20"]

[phases.install]
cmds = ["npm install --legacy-peer-deps"]
dependsOn = ["setup"]

[phases.build]
cmds = ["npm run build"]
dependsOn = ["install"]

[variables]
NODE_OPTIONS = "--max-old-space-size=2048"
NEXT_TELEMETRY_DISABLED = "1"
NODE_ENV = "production"

[start]
cmd = "npm start"
