<figcaption><span>Diapositive 1 sur 6</span><span>The World Keys</span></figcaption>
<details><summary>Notes du présentateur</summary><p>Ouverture (15 s) : « Je vais vous raconter, avec une cliente d’exemple, Anna, ce qui se passe aujourd’hui quand quelqu’un demande une table. Cinq minutes. »</p></details>
</figure>
<figure id="frase">
<div class="tela"><section id="frase" data-transition="fade" style="background:#f7f4ef;color:#1f232c;font-family:'Jost', Arial, sans-serif;padding:128px 128px 160px;display:flex;flex-direction:column;justify-content:space-between;gap:40px">

<p style="font-size:24px;letter-spacing:6px;text-transform:uppercase;color:#7a5c2c;font-weight:500">Toute l’idée en une phrase</p>
<h2 style="font-family:'Cormorant Garamond', Georgia, serif;font-size:72px;font-weight:500;line-height:1.1;width:1640px">Chaque demande de table a quelqu’un qui s’en occupe du début à la fin. WhatsApp prévient le client et le restaurant à chaque étape. Le Gardien relance ceux qui n’ont pas répondu.</h2>
</div>
<div style="display:flex;gap:20px">
<div style="flex:1;background:#141821;padding:34px 36px;display:flex;flex-direction:column;gap:12px">
<p style="font-size:24px;letter-spacing:4px;text-transform:uppercase;color:#e4c990;font-weight:500">Pour le client</p>
<p style="font-family:'Cormorant Garamond', Georgia, serif;font-size:44px;font-weight:600;line-height:1.1;color:#ede9df">Il ne reste plus jamais sans réponse</p>
<p style="font-size:26px;line-height:1.4;color:#ede9df">Il reçoit sur WhatsApp, dans sa langue, chaque nouvelle de sa réservation. Si le restaurant tarde, il entend la vérité avant la date et obtient une alternative.</p>
</div>
<div style="flex:1;background:#efe9dd;border:1px solid #d9d2c3;padding:34px 36px;display:flex;flex-direction:column;gap:12px">
<p style="font-size:24px;letter-spacing:4px;text-transform:uppercase;color:#7a5c2c;font-weight:500">Pour le restaurant</p>
<p style="font-family:'Cormorant Garamond', Georgia, serif;font-size:44px;font-weight:600;line-height:1.1">La demande arrive dans la poche, avec un bouton</p>
<p style="font-size:26px;line-height:1.4;color:#3a3f4b">Nom, date, heure, couverts et « Accepter ou refuser ». Un seul geste. La veille, l’agenda du jour. Rien à installer.</p>
</div>
<div style="flex:1;background:#efe9dd;border:1px solid #d9d2c3;padding:34px 36px;display:flex;flex-direction:column;gap:12px">
<p style="font-size:24px;letter-spacing:4px;text-transform:uppercase;color:#7a5c2c;font-weight:500">Pour nous</p>
<p style="font-family:'Cormorant Garamond', Georgia, serif;font-size:44px;font-weight:600;line-height:1.1">Tout est mesuré, rien n’est promis</p>
<p style="font-size:26px;line-height:1.4;color:#3a3f4b">Nous savons qui a reçu, qui a lu et qui a accepté. Nous ne disons jamais « confirmé » avant le oui du restaurant.</p>
</div>

<p style="font-size:24px;line-height:1.4;color:#6b6f7a">Jamais plus de deux contacts au restaurant pour la même réservation. Jamais « confirmé » avant son oui.</p>
