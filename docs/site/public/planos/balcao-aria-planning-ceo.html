  .tela>section li{line-height:inherit}

  details{margin-top:6px;font-size:14.5px;color:var(--ink)}
  details summary{cursor:pointer;color:var(--accent);font-size:13px;letter-spacing:.04em}
  details p{margin:8px 0 0;max-width:72ch;white-space:pre-wrap}
  @media print{body{background:#fff;padding:0}.tela{box-shadow:none;border:0}figure{break-inside:avoid;page-break-inside:avoid;margin:0 0 12px}details{display:none}}

<header><h1>Balcão Aria — a nova proposta de negócio</h1><p>Apresentação de 2026-11-11 · 10 slides</p></header>
<figure id="cover">
<div class="tela"><section id="cover" data-transition="fade" style="background:#141821;color:#ede9df;font-family:'Jost', Arial, sans-serif;padding:128px;display:flex;flex-direction:column;justify-content:space-between">
<p style="font-size:24px;letter-spacing:6px;text-transform:uppercase;color:#c9a96e;font-weight:500">The World Keys · Paris · 11 de novembro de 2026</p>
<div style="display:flex;flex-direction:column;gap:28px">
<h1 style="font-family:'Cormorant Garamond', Georgia, serif;font-size:132px;font-weight:500;line-height:1.02">Balcão Aria</h1>
<hr style="border-top:3px solid #c9a96e;width:160px">
<p style="font-family:'Cormorant Garamond', Georgia, serif;font-size:48px;font-style:italic;line-height:1.25;color:#ede9df;width:1500px">A noite do hóspede, com a mesa já guardada: carro e mesa num pedido só, vendidos ao concierge do hotel. Agora com a Maelle abrindo as casas de Paris.</p>

<figcaption><span>Slide 1 de 10</span><span>The World Keys</span></figcaption>
<details><summary>Notas do apresentador</summary><p>Abertura (15 s): « O plano é o mesmo de outubro, com uma peça nova que muda o tamanho dele: a Maelle, em Paris, abrindo os restaurantes. Vou mostrar o que isso permite vender, quanto fica e o que preciso de você. Sete minutos. »</p></details>
</figure>

  <div style="display:flex; flex-direction:column; gap:14px">

    <h2 style="width:1640px; font-family:'Cormorant Garamond', Georgia, serif; font-size:72px; font-weight:500; line-height:1.1; color:#1f232c">O concierge do hotel nos pede a noite do hóspede. A Aria confirma carro e mesa na mesma conversa. O hotel recebe uma fatura por mês.</h2>

      <p style="font-family:Jost, Arial, sans-serif; font-size:26px; line-height:1.4; color:#ede9df">Eles já compram carro e mesa toda semana para os clientes deles, e pagam comissão a quem resolve. Passam a comprar de nós.</p>

      <p style="font-family:Jost, Arial, sans-serif; font-size:26px; line-height:1.4; color:#3a3f4b">O hóspede chega com o nosso chauffeur, na hora, a uma mesa que já estava reservada para ele. Ninguém mais entrega as duas coisas juntas numa mensagem.</p>

      <p style="font-family:Jost, Arial, sans-serif; font-size:26px; line-height:1.4; color:#3a3f4b">O serviço de motorista particular já é nosso. Sobra quase tudo depois de energia, pedágio e estacionamento. Os restaurantes continuam parceiros: são a mesa do voucher.</p>

  </div>

<figcaption><span>Slide 2 de 10</span><span>The World Keys</span></figcaption>
<details><summary>Notas do apresentador</summary><p>45 s. Leia a frase e pare. A palavra nova é &quot;confirma&quot;: em outubro a frase dizia &quot;organiza&quot;, porque a mesa dependia de esperar a resposta da casa. Depois as três caixas: quem paga, o que vendemos, o que fica. Se perguntarem &quot;e os restaurantes?&quot;: continuam parceiros e continuam recebendo a oferta de assinatura; o que muda é quem paga primeiro, e agora eles têm uma pessoa em Paris que fala com eles.</p></details>
</figure>

<p style="font-family:'Cormorant Garamond', Georgia, serif;font-size:42px;font-weight:600;line-height:1.1;color:#ede9df">Pedimos a mesa e esperamos</p>
<p style="font-size:25px;line-height:1.4;color:#b5b1a7">Uma casa em Paris confirma com regularidade. Nas outras, a resposta leva horas ou não vem, e o concierge não espera.</p>

<p style="font-size:25px;line-height:1.4;color:#3a3f4b">Em cada casa parceira, uma mesa fica reservada aos nossos hóspedes até as 5:00 PM, nas noites combinadas. A Aria confirma mesa e carro na mesma conversa.</p>

<p style="font-size:25px;line-height:1.4;color:#ede9df">Um sim na hora, um gesto da casa que ele não consegue sozinho, 10 % e uma fatura só.</p>
</div>
<div style="flex:1;background:#1c2130;border:1px solid #2a3040;padding:22px 28px;display:flex;flex-direction:column;gap:6px">
<p style="font-size:24px;letter-spacing:4px;text-transform:uppercase;color:#e4c990;font-weight:500">A casa ganha</p>
<p style="font-size:25px;line-height:1.4;color:#ede9df">Hóspedes de hotel que chegam na hora, com chauffeur. Sem custo, sem exclusividade. Mesa não pedida volta para ela às 5:00 PM.</p>
</div>
<div style="flex:1;background:#1c2130;border:1px solid #c9a96e;padding:22px 28px;display:flex;flex-direction:column;gap:6px">
<p style="font-size:24px;letter-spacing:4px;text-transform:uppercase;color:#e4c990;font-weight:500">Nós ganhamos</p>

<figcaption><span>Slide 3 de 10</span><span>The World Keys</span></figcaption>
<details><summary>Notas do apresentador</summary><p>1 min. Este é o slide que muda o plano. Em outubro tínhamos o carro e a Aria, e uma casa só que confirmava: o concierge esperava quase duas horas pelo sim. A Maelle resolve o lado que faltava. O que ela pede à casa é pequeno (uma mesa guardada até as 5:00 PM, liberada sozinha se ninguém pedir, e um gesto de boas-vindas) e o que oferece é o que a casa quer: hóspede de hotel, pontual, trazido à porta. Fato: desde 2 de novembro ela recebe por e-mail cada pedido de mesa de Paris no mesmo instante que a casa, com os botões de contato. Suposição a provar nas primeiras conversas: quantas casas aceitam guardar a mesa. Se uma casa não aceitar a mesa guardada, o degrau abaixo é responder ao pedido pelo WhatsApp em até uma hora; ela entra na lista, mas não leva o nome Signature. Regra que não muda: fora das casas Signature, a mesa só entra no voucher depois do sim do restaurante.</p></details>
</figure>
<figure id="dia">
<div class="tela"><section id="dia" data-transition="fade" style="background:#f7f4ef;color:#1f232c;font-family:'Jost', Arial, sans-serif;padding:128px 128px 160px;display:flex;flex-direction:column;justify-content:space-between;gap:30px">

<div style="display:flex;gap:24px;padding:9px 0 9px 28px;border-bottom:1px solid #d9d2c3"><p style="font-size:26px;font-weight:500;color:#7a5c2c;width:120px;white-space:nowrap">9:04 AM</p><p style="font-size:26px;line-height:1.4;color:#3a3f4b;width:760px">O concierge escreve no WhatsApp: « casal americano, chega em CDG às 2:20 PM, jantar hoje 8:30 PM, algo bom perto do hotel ».</p></div>
<div style="display:flex;gap:24px;padding:9px 0 9px 28px;border-bottom:1px solid #d9d2c3"><p style="font-size:26px;font-weight:500;color:#7a5c2c;width:120px;white-space:nowrap">9:10 AM</p><p style="font-size:26px;line-height:1.4;color:#3a3f4b;width:760px">A Aria responde com duas casas que têm mesa guardada hoje e o preço: transfer 150 € + Soirée Signature 490 €.</p></div>
<div style="display:flex;gap:24px;padding:9px 0 9px 28px;border-bottom:1px solid #d9d2c3"><p style="font-size:26px;font-weight:500;color:#7a5c2c;width:120px;white-space:nowrap">9:25 AM</p><p style="font-size:26px;line-height:1.4;color:#3a3f4b;width:760px">O concierge escolhe o Monak. O Julien confirma a corrida com um toque. Fechado: 640 €, pelo link ou na fatura do mês do hotel.</p></div>
<div style="display:flex;gap:24px;padding:9px 0 9px 28px;border-bottom:1px solid #d9d2c3"><p style="font-size:26px;font-weight:500;color:#7a5c2c;width:120px;white-space:nowrap">2:20 PM</p><p style="font-size:26px;line-height:1.4;color:#3a3f4b;width:760px">Placa com o nome em CDG. Ao deixar o casal no hotel, o Julien entrega o cartão de tarifas ao balcão.</p></div>
<div style="display:flex;gap:24px;padding:9px 0 9px 28px;border-bottom:1px solid #d9d2c3"><p style="font-size:26px;font-weight:500;color:#7a5c2c;width:120px;white-space:nowrap">8:10 PM</p><p style="font-size:26px;line-height:1.4;color:#3a3f4b;width:760px">A casa recebe o casal pelo nome, com o gesto combinado. O carro espera e traz de volta.</p></div>
<div style="display:flex;gap:24px;padding:9px 0 9px 28px"><p style="font-size:26px;font-weight:500;color:#7a5c2c;width:120px;white-space:nowrap">Dia 30</p><p style="font-size:26px;line-height:1.4;color:#3a3f4b;width:760px">Fatura única ao hotel, 10 % ao concierge. A casa recebe o relatório dos hóspedes que mandamos.</p></div>
</div>
<div style="width:520px;display:flex;flex-direction:column;gap:16px">

<p style="font-size:24px;letter-spacing:4px;text-transform:uppercase;color:#e4c990;font-weight:500">O hóspede pagou</p>

<figcaption><span>Slide 4 de 10</span><span>The World Keys</span></figcaption>
<details><summary>Notas do apresentador</summary><p>1 min 30. Conte como uma história. É o mesmo dia do deck de outubro, com uma diferença: naquele, a Aria pedia a mesa às 9:40 AM e o sim chegava às 11:00 AM. Aqui a mesa já estava guardada, então a Aria responde com casa e preço na mesma conversa. O Monak aparece como exemplo porque é a casa de Paris que já confirma os nossos pedidos; o acordo de mesa guardada com ele ainda é uma conversa a ter. Os 21 minutos são do exemplo, não uma promessa ao cliente. &quot;Ficou na empresa&quot; é contribuição depois da comissão do concierge e do custo variável; o fixo do carro e do chauffeur aparece no slide 6. O relatório à casa no dia 30 é a porta para o convite à parceria completa.</p></details>
