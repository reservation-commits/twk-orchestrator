<details><summary>Notas do apresentador</summary><p>Abertura (15 s): « Vou contar com uma cliente de exemplo, a Anna, o que acontece hoje quando alguém pede uma mesa. Cinco minutos. »</p></details>
</figure>
<figure id="frase">
<div class="tela"><section id="frase" data-transition="fade" style="background:#f7f4ef;color:#1f232c;font-family:'Jost', Arial, sans-serif;padding:128px 128px 160px;display:flex;flex-direction:column;justify-content:space-between;gap:40px">
<div style="display:flex;flex-direction:column;gap:14px">
<p style="font-size:24px;letter-spacing:6px;text-transform:uppercase;color:#7a5c2c;font-weight:500">A ideia inteira em uma frase</p>
<h2 style="font-family:'Cormorant Garamond', Georgia, serif;font-size:72px;font-weight:500;line-height:1.1;width:1640px">Cada pedido de mesa tem alguém cuidando dele do início ao fim. O WhatsApp avisa cliente e restaurante a cada passo. O Guardião cobra quem não respondeu.</h2>
</div>
<div style="display:flex;gap:20px">
<div style="flex:1;background:#141821;padding:34px 36px;display:flex;flex-direction:column;gap:12px">
<p style="font-size:24px;letter-spacing:4px;text-transform:uppercase;color:#e4c990;font-weight:500">Para o cliente</p>
<p style="font-family:'Cormorant Garamond', Georgia, serif;font-size:44px;font-weight:600;line-height:1.1;color:#ede9df">Nunca mais fica sem resposta</p>
<p style="font-size:26px;line-height:1.4;color:#ede9df">Recebe no WhatsApp, no idioma dele, cada novidade da reserva. Se o restaurante demora, ouve a verdade antes da data e ganha uma alternativa.</p>
</div>
<div style="flex:1;background:#efe9dd;border:1px solid #d9d2c3;padding:34px 36px;display:flex;flex-direction:column;gap:12px">
<p style="font-size:24px;letter-spacing:4px;text-transform:uppercase;color:#7a5c2c;font-weight:500">Para o restaurante</p>
<p style="font-family:'Cormorant Garamond', Georgia, serif;font-size:44px;font-weight:600;line-height:1.1">O pedido chega no bolso, com um botão</p>
<p style="font-size:26px;line-height:1.4;color:#3a3f4b">Nome, data, hora, pessoas e "Aceitar ou recusar". Um toque. Na véspera, a agenda do dia. Nada para instalar.</p>
</div>
<div style="flex:1;background:#efe9dd;border:1px solid #d9d2c3;padding:34px 36px;display:flex;flex-direction:column;gap:12px">
<p style="font-size:24px;letter-spacing:4px;text-transform:uppercase;color:#7a5c2c;font-weight:500">Para nós</p>
<p style="font-family:'Cormorant Garamond', Georgia, serif;font-size:44px;font-weight:600;line-height:1.1">Tudo medido, nada prometido</p>
<p style="font-size:26px;line-height:1.4;color:#3a3f4b">Sabemos quem recebeu, quem leu e quem aceitou. Nunca dizemos "confirmado" antes do sim do restaurante.</p>
</div>
</div>

<p style="font-size:24px;letter-spacing:6px;text-transform:uppercase;color:#7a5c2c;font-weight:500">Um exemplo, do pedido ao dia seguinte</p>
<h2 style="font-family:'Cormorant Garamond', Georgia, serif;font-size:68px;font-weight:500;line-height:1.08">A Anna pede uma mesa para sábado no Le Tobsil</h2>
</div>
<div style="display:flex;gap:40px">
<div style="flex:1;display:flex;flex-direction:column;border-left:3px solid #c9a96e">
<div style="display:flex;gap:24px;padding:11px 0 11px 28px;border-bottom:1px solid #d9d2c3"><p style="font-size:26px;font-weight:500;color:#7a5c2c;width:150px;white-space:nowrap">Terça 10h</p><p style="font-size:26px;line-height:1.4;color:#3a3f4b;width:740px">A Anna pede no site. Em segundos recebe no WhatsApp: « Recebemos o seu pedido e já estamos cuidando dele. »</p></div>
<div style="display:flex;gap:24px;padding:11px 0 11px 28px;border-bottom:1px solid #d9d2c3"><p style="font-size:26px;font-weight:500;color:#7a5c2c;width:150px;white-space:nowrap">Terça 10h</p><p style="font-size:26px;line-height:1.4;color:#3a3f4b;width:740px">O Le Tobsil recebe o pedido no celular, com nome, data, hora, pessoas e o botão <b>Aceitar ou recusar</b>.</p></div>
<div style="display:flex;gap:24px;padding:11px 0 11px 28px;border-bottom:1px solid #d9d2c3"><p style="font-size:26px;font-weight:500;color:#7a5c2c;width:150px;white-space:nowrap">Terça 10h08</p><p style="font-size:26px;line-height:1.4;color:#3a3f4b;width:740px">O restaurante toca em Aceitar. A Anna recebe: « Mesa aceita. » Pronto.</p></div>
<div style="display:flex;gap:24px;padding:11px 0 11px 28px;border-bottom:1px solid #d9d2c3"><p style="font-size:26px;font-weight:500;color:#7a5c2c;width:150px;white-space:nowrap">Sexta à noite</p><p style="font-size:26px;line-height:1.4;color:#3a3f4b;width:740px">A Anna recebe o lembrete da véspera com endereço e botão do mapa. O Le Tobsil recebe a agenda do sábado.</p></div>
<div style="display:flex;gap:24px;padding:11px 0 11px 28px;border-bottom:1px solid #d9d2c3"><p style="font-size:26px;font-weight:500;color:#7a5c2c;width:150px;white-space:nowrap">Sábado 18h</p><p style="font-size:26px;line-height:1.4;color:#3a3f4b;width:740px">Duas horas antes, um último lembrete. Depois do jantar, « como foi? ».</p></div>
<div style="display:flex;gap:24px;padding:11px 0 11px 28px"><p style="font-size:26px;font-weight:500;color:#7a5c2c;width:150px;white-space:nowrap">Por trás</p><p style="font-size:26px;line-height:1.4;color:#3a3f4b;width:740px">Tudo no idioma da Anna, com data por extenso. O restaurante recebe em francês. Cada mensagem sai uma vez, e só para quem disse que quer receber.</p></div>
</div>
<div style="width:540px;display:flex;flex-direction:column;gap:16px">
<div style="background:#141821;padding:28px 32px;display:flex;flex-direction:column;gap:10px">
<p style="font-size:24px;letter-spacing:4px;text-transform:uppercase;color:#e4c990;font-weight:500">E se o restaurante não responde?</p>
<p style="font-size:25px;line-height:1.45;color:#ede9df"><b>24 h depois:</b> a Anna recebe « seu pedido segue conosco », com botão para procurar outra mesa ou aguardar. O Guardião cobra o restaurante por e-mail, no idioma dele.</p>
<p style="font-size:25px;line-height:1.45;color:#ede9df"><b>48 h depois:</b> a equipe recebe o texto pronto para mandar por WhatsApp ou ligar.</p>
<p style="font-size:25px;line-height:1.45;color:#ede9df"><b>20 h antes da mesa:</b> a Anna ouve a verdade e recebe uma alternativa que confirma.</p>
</div>
<p style="font-size:24px;line-height:1.4;color:#6b6f7a">Nunca mais de dois contatos ao restaurante pela mesma reserva. Nunca "confirmado" antes do sim dele.</p>
</div>
</div>
