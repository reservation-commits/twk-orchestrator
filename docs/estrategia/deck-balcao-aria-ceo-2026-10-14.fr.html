<h1 style="font-family:'Cormorant Garamond', Georgia, serif;font-size:132px;font-weight:500;line-height:1.02">Comptoir Aria</h1>

<p style="font-family:'Cormorant Garamond', Georgia, serif;font-size:48px;font-style:italic;line-height:1.25;color:#ede9df;width:1400px">La soirée du client de l’hôtel, réglée : voiture et table en une seule demande, vendues au concierge de l’hôtel.</p>

<figcaption><span>Diapositive 1 sur 9</span><span>The World Keys</span></figcaption>
<details><summary>Notes du présentateur</summary><p>Ouverture (15 s) : « Je vais montrer, avec une journée d’exemple, ce que nous vendons, à qui, ce qui nous reste et ce dont j’ai besoin de vous. Six minutes. »</p></details>

    <p style="font-family:Jost, Arial, sans-serif; font-size:24px; font-weight:500; letter-spacing:6px; text-transform:uppercase; color:#7a5c2c">L’idée entière en une phrase</p>
    <h2 style="width:1640px; font-family:'Cormorant Garamond', Georgia, serif; font-size:72px; font-weight:500; line-height:1.1; color:#1f232c">Le concierge de l’hôtel nous demande la soirée de son client. Aria organise voiture et table par WhatsApp. L’hôtel reçoit une facture par mois.</h2>
  </div>
  <div style="display:flex; flex-direction:row; gap:20px">
    <div style="display:flex; flex-direction:column; gap:12px; flex:1; padding:34px 36px; background:#141821">
      <p style="font-family:Jost, Arial, sans-serif; font-size:24px; font-weight:500; letter-spacing:4px; text-transform:uppercase; color:#e4c990">Qui paie</p>
      <p style="font-family:'Cormorant Garamond', Georgia, serif; font-size:44px; font-weight:600; line-height:1.1; color:#ede9df">Concierges d’hôtel, gestionnaires de villas, agences</p>
      <p style="font-family:Jost, Arial, sans-serif; font-size:26px; line-height:1.4; color:#ede9df">Ils achètent déjà voiture et table chaque semaine pour leurs clients, et paient une commission à qui s’en charge. Désormais, ils achètent chez nous.</p>
    </div>
    <div style="display:flex; flex-direction:column; gap:12px; flex:1; padding:34px 36px; background:#efe9dd; border:1px solid #d9d2c3">
      <p style="font-family:Jost, Arial, sans-serif; font-size:24px; font-weight:500; letter-spacing:4px; text-transform:uppercase; color:#7a5c2c">Ce que nous vendons</p>
      <p style="font-family:'Cormorant Garamond', Georgia, serif; font-size:44px; font-weight:600; line-height:1.1; color:#1f232c">Voiture et table confirmée, sur un seul voucher</p>
      <p style="font-family:Jost, Arial, sans-serif; font-size:26px; line-height:1.4; color:#3a3f4b">Le client de l’hôtel arrive au restaurant avec notre chauffeur, à l’heure, et repart quand il le souhaite. Personne d’autre ne livre les deux ensemble en un seul message.</p>
    </div>
    <div style="display:flex; flex-direction:column; gap:12px; flex:1; padding:34px 36px; background:#efe9dd; border:1px solid #d9d2c3">

      <p style="font-family:'Cormorant Garamond', Georgia, serif; font-size:44px; font-weight:600; line-height:1.1; color:#1f232c">85 à 95 % de chaque service</p>
      <p style="font-family:Jost, Arial, sans-serif; font-size:26px; line-height:1.4; color:#3a3f4b">Le service de chauffeur privé est déjà le nôtre. Il reste presque tout après l’énergie, les péages et le stationnement. Les restaurants restent partenaires : ils sont la table du voucher.</p>
    </div>
  </div>

<figcaption><span>Diapositive 2 sur 9</span><span>The World Keys</span></figcaption>
<details><summary>Notes du présentateur</summary><p>45 s. Lisez la phrase et marquez une pause. Puis les trois cases : qui paie, ce que nous vendons, ce qui reste. Si l’on demande « et les restaurants ? » : ils restent partenaires et continuent de recevoir l’offre d’abonnement ; ce qui change, c’est qui paie en premier. Le comptoir amène aussi de nouvelles maisons : chaque demande d’hôtel acceptée devient une invitation au partenariat.</p></details>

<div style="display:flex;gap:24px;padding:12px 0 12px 28px;border-bottom:1px solid #d9d2c3"><p style="font-size:26px;font-weight:500;color:#7a5c2c;width:120px;white-space:nowrap">9h40</p><p style="font-size:26px;line-height:1.4;color:#3a3f4b;width:760px">Aria répond avec le prix de la grille : transfert 150 € + Soirée 390 €. En même temps, elle demande la table au Monak et la course à Julien.</p></div>
<div style="display:flex;gap:24px;padding:12px 0 12px 28px;border-bottom:1px solid #d9d2c3"><p style="font-size:26px;font-weight:500;color:#7a5c2c;width:120px;white-space:nowrap">11h00</p><p style="font-size:26px;line-height:1.4;color:#3a3f4b;width:760px">Le Monak accepte, Julien confirme. C’est seulement maintenant qu’Aria conclut : 540 €. Le client paie par lien, ou l’hôtel cumule sur la facture du mois.</p></div>
<div style="display:flex;gap:24px;padding:12px 0 12px 28px;border-bottom:1px solid #d9d2c3"><p style="font-size:26px;font-weight:500;color:#7a5c2c;width:120px;white-space:nowrap">14h20</p><p style="font-size:26px;line-height:1.4;color:#3a3f4b;width:760px">Pancarte au nom du client à CDG. En déposant le couple à l’hôtel, Julien remet la carte des tarifs au comptoir.</p></div>
<div style="display:flex;gap:24px;padding:12px 0 12px 28px;border-bottom:1px solid #d9d2c3"><p style="font-size:26px;font-weight:500;color:#7a5c2c;width:120px;white-space:nowrap">20h10</p><p style="font-size:26px;line-height:1.4;color:#3a3f4b;width:760px">Soirée : conduite au restaurant, attente, retour.</p></div>
<div style="display:flex;gap:24px;padding:12px 0 12px 28px"><p style="font-size:26px;font-weight:500;color:#7a5c2c;width:120px;white-space:nowrap">Le 30</p><p style="font-size:26px;line-height:1.4;color:#3a3f4b;width:760px">Facture unique à l’hôtel. Le concierge reçoit 10 %. Et il redemande la semaine suivante.</p></div>

<figcaption><span>Diapositive 3 sur 9</span><span>The World Keys</span></figcaption>
<details><summary>Notes du présentateur</summary><p>1 min 30. Racontez-le comme une histoire. Le point à fixer : le même message du concierge génère deux services, et Aria ne parle de montant ferme qu’après les deux oui (restaurant et chauffeur). « Resté à l’entreprise », c’est la contribution après le coût variable ; le fixe de la voiture et du chauffeur apparaît à la diapositive 5. La carte au comptoir de l’hôtel est le vendeur de terrain sans coût.</p></details>
