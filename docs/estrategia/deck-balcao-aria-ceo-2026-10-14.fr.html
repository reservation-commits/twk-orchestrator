<figcaption><span>Diapositive 1 sur 10</span><span>The World Keys</span></figcaption>
<details><summary>Notes du présentateur</summary><p>Ouverture (15 s) : « Le plan est le même qu’en octobre, avec une pièce nouvelle qui en change la taille : Maelle, à Paris, qui ouvre les restaurants. Je vais vous montrer ce que cela permet de vendre, ce qui nous reste et ce dont j’ai besoin de vous. Sept minutes. »</p></details>

<figcaption><span>Diapositive 2 sur 10</span><span>The World Keys</span></figcaption>
<details><summary>Notes du présentateur</summary><p>45 s. Lisez la phrase et marquez une pause. Le mot nouveau est « confirme » : en octobre, la phrase disait « organise », car la table dépendait de la réponse de la maison, qu’il fallait attendre. Puis les trois cases : qui paie, ce que nous vendons, ce qui nous reste. Si l’on demande « et les restaurants ? » : ils restent partenaires et continuent de recevoir l’offre d’abonnement ; ce qui change, c’est qui paie en premier, et ils ont désormais une personne à Paris qui leur parle.</p></details>

<figcaption><span>Diapositive 3 sur 10</span><span>The World Keys</span></figcaption>
<details><summary>Notes du présentateur</summary><p>1 min. C’est la diapositive qui change le plan. En octobre, nous avions la voiture et Aria, et une seule maison qui confirmait : le concierge attendait le oui près de deux heures. Maelle règle le côté qui manquait. Ce qu’elle demande à la maison est peu de chose (une table gardée jusqu’à 5:00 PM, libérée d’elle-même si personne ne la demande, et une attention d’accueil) et ce qu’elle offre est ce que la maison veut : un client d’hôtel, ponctuel, amené à la porte. Fait : depuis le 2 novembre, elle reçoit par e-mail chaque demande de table à Paris au même instant que la maison, avec les boutons de contact. Hypothèse à vérifier dans les premières conversations : combien de maisons acceptent de garder la table. Si une maison refuse la table gardée, l’échelon en dessous est de répondre à la demande par WhatsApp dans l’heure ; elle entre dans la liste, mais ne porte pas le nom Signature. Règle qui ne change pas : hors des maisons Signature, la table n’entre dans le voucher qu’après le oui du restaurant.</p></details>

<figcaption><span>Diapositive 4 sur 10</span><span>The World Keys</span></figcaption>
<details><summary>Notes du présentateur</summary><p>1 min 30. Racontez-le comme une histoire. C’est la même journée que dans la présentation d’octobre, à une différence près : là, Aria demandait la table à 9:40 AM et le oui arrivait à 11:00 AM. Ici, la table était déjà gardée, donc Aria répond avec la maison et le prix dans la même conversation. Le Monak sert d’exemple parce que c’est la maison de Paris qui confirme déjà nos demandes ; l’accord de table gardée avec lui reste une conversation à avoir. Les 21 minutes sont celles de l’exemple, pas une promesse au client. « Resté à l’entreprise », c’est la contribution après la commission du concierge et le coût variable ; le fixe de la voiture et du chauffeur apparaît à la diapositive 6. Le rapport remis à la maison le 30 est la porte vers l’invitation au partenariat complet.</p></details>
