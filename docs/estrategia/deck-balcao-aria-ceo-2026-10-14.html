<style>

  /* Fator = largura da tela ÷ 1920 px. CSS não divide comprimentos; tan(atan2(a, b)) devolve a/b como número puro. */
  .tela>section{width:1920px;height:1080px;position:relative;transform-origin:0 0;transform:scale(tan(atan2(100cqw, 1920px)));overflow:hidden}
  @supports not (transform:scale(tan(atan2(1cqw, 1px)))){.tela{aspect-ratio:auto;overflow:auto}.tela>section{transform:none}}
  /* Padrões do formato de slide: nada de margem, tamanhos explícitos vêm inline. */
  .tela>section *{margin:0;box-sizing:border-box}
  .tela>section h1{font-size:96px;font-weight:600;line-height:1.1}
  .tela>section h2{font-size:64px;font-weight:600;line-height:1.15}
  .tela>section h3{font-size:44px;font-weight:600;line-height:1.2}
  .tela>section p{font-size:32px;line-height:1.4}
  .tela>section ul,.tela>section ol{padding-left:1.2em}
  .tela>section li{line-height:inherit}
  .tela>section hr{border:0;height:0}
  .tela>section div:not([style*="display:"]){display:flex;flex-direction:column}

  figcaption{display:flex;justify-content:space-between;gap:12px;margin-top:8px;font:12px/1.4 "IBM Plex Mono",ui-monospace,Consolas,monospace;letter-spacing:.06em;color:var(--muted);text-transform:uppercase}
  details{margin-top:6px;font-size:14.5px;color:var(--ink)}
  details summary{cursor:pointer;color:var(--accent);font-size:13px;letter-spacing:.04em}
  details p{margin:8px 0 0;max-width:72ch;white-space:pre-wrap}
  @media print{body{background:#fff;padding:0}.tela{box-shadow:none;border:0}figure{break-inside:avoid;page-break-inside:avoid;margin:0 0 12px}details{display:none}}
</style>

<header><h1>Balcão Aria — a nova proposta de negócio</h1><p>Apresentação de 2026-10-14 · 9 slides</p></header>
<figure id="cover">
<div class="tela"><section id="cover" data-transition="fade" style="background:#141821;color:#ede9df;font-family:'Jost', Arial, sans-serif;padding:128px;display:flex;flex-direction:column;justify-content:space-between">
<p style="font-size:24px;letter-spacing:6px;text-transform:uppercase;color:#c9a96e;font-weight:500">The World Keys · Paris · 16 de outubro de 2026</p>
<div style="display:flex;flex-direction:column;gap:28px">
<h1 style="font-family:'Cormorant Garamond', Georgia, serif;font-size:132px;font-weight:500;line-height:1.02">Balcão Aria</h1>
<hr style="border-top:3px solid #c9a96e;width:160px">
<p style="font-family:'Cormorant Garamond', Georgia, serif;font-size:48px;font-style:italic;line-height:1.25;color:#ede9df;width:1400px">A noite do hóspede, resolvida: carro e mesa num pedido só, vendidos ao concierge do hotel.</p>

</div>
</section></div>
<figcaption><span>Slide 1 de 9</span><span>The World Keys</span></figcaption>
<details><summary>Notas do apresentador</summary><p>Abertura (15 s): « Vou mostrar com um dia de exemplo o que vendemos, a quem, quanto fica e o que preciso de você. Seis minutos. »</p></details>
</figure>
<figure id="frase">
<div class="tela"><section id="frase" data-transition="fade" style="display:flex; flex-direction:column; gap:40px; justify-content:space-between; padding:128px 128px 160px; background:#f7f4ef">
  <div style="display:flex; flex-direction:column; gap:14px">
    <p style="font-family:Jost, Arial, sans-serif; font-size:24px; font-weight:500; letter-spacing:6px; text-transform:uppercase; color:#7a5c2c">A ideia inteira em uma frase</p>
    <h2 style="width:1640px; font-family:'Cormorant Garamond', Georgia, serif; font-size:72px; font-weight:500; line-height:1.1; color:#1f232c">O concierge do hotel nos pede a noite do hóspede. A Aria organiza carro e mesa pelo WhatsApp. O hotel recebe uma fatura por mês.</h2>
  </div>
  <div style="display:flex; flex-direction:row; gap:20px">
    <div style="display:flex; flex-direction:column; gap:12px; flex:1; padding:34px 36px; background:#141821">
      <p style="font-family:Jost, Arial, sans-serif; font-size:24px; font-weight:500; letter-spacing:4px; text-transform:uppercase; color:#e4c990">Quem paga</p>
      <p style="font-family:'Cormorant Garamond', Georgia, serif; font-size:44px; font-weight:600; line-height:1.1; color:#ede9df">Concierges de hotel, gestores de villas, agências</p>
      <p style="font-family:Jost, Arial, sans-serif; font-size:26px; line-height:1.4; color:#ede9df">Eles já compram carro e mesa toda semana para os clientes deles, e pagam comissão a quem resolve. Passam a comprar de nós.</p>
    </div>
    <div style="display:flex; flex-direction:column; gap:12px; flex:1; padding:34px 36px; background:#efe9dd; border:1px solid #d9d2c3">
      <p style="font-family:Jost, Arial, sans-serif; font-size:24px; font-weight:500; letter-spacing:4px; text-transform:uppercase; color:#7a5c2c">O que vendemos</p>
      <p style="font-family:'Cormorant Garamond', Georgia, serif; font-size:44px; font-weight:600; line-height:1.1; color:#1f232c">Carro e mesa confirmada, num voucher só</p>
      <p style="font-family:Jost, Arial, sans-serif; font-size:26px; line-height:1.4; color:#3a3f4b">O hóspede chega ao restaurante com o nosso chauffeur, na hora, e volta quando quiser. Ninguém mais entrega as duas coisas juntas numa mensagem.</p>
    </div>
    <div style="display:flex; flex-direction:column; gap:12px; flex:1; padding:34px 36px; background:#efe9dd; border:1px solid #d9d2c3">
      <p style="font-family:Jost, Arial, sans-serif; font-size:24px; font-weight:500; letter-spacing:4px; text-transform:uppercase; color:#7a5c2c">O que fica na empresa</p>
      <p style="font-family:'Cormorant Garamond', Georgia, serif; font-size:44px; font-weight:600; line-height:1.1; color:#1f232c">85 a 95 % de cada serviço</p>
      <p style="font-family:Jost, Arial, sans-serif; font-size:26px; line-height:1.4; color:#3a3f4b">O serviço de motorista particular já é nosso. Sobra quase tudo depois de energia, pedágio e estacionamento. Os restaurantes continuam parceiros: são a mesa do voucher.</p>
    </div>
  </div>
  <div style="position:absolute; right:128px; bottom:64px; left:128px; display:flex; flex-direction:row; justify-content:space-between">
    <p style="font-family:Jost, Arial, sans-serif; font-size:24px; color:#6b6f7a">The World Keys · Balcão Aria · 16 de outubro de 2026</p>
    <p style="font-family:Jost, Arial, sans-serif; font-size:24px; color:#6b6f7a">2 / 9</p>
  </div>
  </section></div>
<figcaption><span>Slide 2 de 9</span><span>The World Keys</span></figcaption>
<details><summary>Notas do apresentador</summary><p>45 s. Leia a frase e pare. Depois as três caixas: quem paga, o que vendemos, o que fica. Se perguntarem &quot;e os restaurantes?&quot;: continuam parceiros e continuam recebendo a oferta de assinatura; o que muda é quem paga primeiro. O balcão também traz casas novas: cada pedido de hotel aceito vira um convite à parceria.</p></details>
</figure>
<figure id="dia">
<div class="tela"><section id="dia" data-transition="fade" style="background:#f7f4ef;color:#1f232c;font-family:'Jost', Arial, sans-serif;padding:128px 128px 160px;display:flex;flex-direction:column;justify-content:space-between;gap:30px">
<div style="display:flex;flex-direction:column;gap:14px">
<p style="font-size:24px;letter-spacing:6px;text-transform:uppercase;color:#7a5c2c;font-weight:500">Um exemplo, do pedido ao fim do mês</p>
<h2 style="font-family:'Cormorant Garamond', Georgia, serif;font-size:68px;font-weight:500;line-height:1.08">Uma terça-feira com o concierge do Hôtel X</h2>
</div>
<div style="display:flex;gap:40px">
<div style="flex:1;display:flex;flex-direction:column;border-left:3px solid #c9a96e">
<div style="display:flex;gap:24px;padding:12px 0 12px 28px;border-bottom:1px solid #d9d2c3"><p style="font-size:26px;font-weight:500;color:#7a5c2c;width:120px;white-space:nowrap">9h04</p><p style="font-size:26px;line-height:1.4;color:#3a3f4b;width:760px">O concierge escreve no WhatsApp: « casal americano, chega em CDG às 14h20, jantar hoje 20h30, algo bom perto do hotel ».</p></div>
<div style="display:flex;gap:24px;padding:12px 0 12px 28px;border-bottom:1px solid #d9d2c3"><p style="font-size:26px;font-weight:500;color:#7a5c2c;width:120px;white-space:nowrap">9h40</p><p style="font-size:26px;line-height:1.4;color:#3a3f4b;width:760px">A Aria responde com o preço da tabela: transfer 150 € + Soirée 390 €. Ao mesmo tempo, pede a mesa ao Monak e a corrida ao Julien.</p></div>
<div style="display:flex;gap:24px;padding:12px 0 12px 28px;border-bottom:1px solid #d9d2c3"><p style="font-size:26px;font-weight:500;color:#7a5c2c;width:120px;white-space:nowrap">11h00</p><p style="font-size:26px;line-height:1.4;color:#3a3f4b;width:760px">O Monak aceita, o Julien confirma. Só agora a Aria fecha: 540 €. O hóspede paga pelo link, ou o hotel acumula na fatura do mês.</p></div>
<div style="display:flex;gap:24px;padding:12px 0 12px 28px;border-bottom:1px solid #d9d2c3"><p style="font-size:26px;font-weight:500;color:#7a5c2c;width:120px;white-space:nowrap">14h20</p><p style="font-size:26px;line-height:1.4;color:#3a3f4b;width:760px">Placa com o nome em CDG. Ao deixar o casal no hotel, o Julien entrega o cartão de tarifas ao balcão.</p></div>
<div style="display:flex;gap:24px;padding:12px 0 12px 28px;border-bottom:1px solid #d9d2c3"><p style="font-size:26px;font-weight:500;color:#7a5c2c;width:120px;white-space:nowrap">20h10</p><p style="font-size:26px;line-height:1.4;color:#3a3f4b;width:760px">Soirée: leva ao restaurante, espera, traz de volta.</p></div>
<div style="display:flex;gap:24px;padding:12px 0 12px 28px"><p style="font-size:26px;font-weight:500;color:#7a5c2c;width:120px;white-space:nowrap">Dia 30</p><p style="font-size:26px;line-height:1.4;color:#3a3f4b;width:760px">Fatura única ao hotel. O concierge recebe 10 %. E volta a pedir na semana seguinte.</p></div>
</div>
<div style="width:520px;display:flex;flex-direction:column;gap:16px">
<div style="background:#141821;padding:30px 32px;display:flex;flex-direction:column;gap:8px">
<p style="font-size:24px;letter-spacing:4px;text-transform:uppercase;color:#e4c990;font-weight:500">O hóspede pagou</p>
<p style="font-family:'Cormorant Garamond', Georgia, serif;font-size:80px;font-weight:600;line-height:1;color:#ede9df">540 €</p>
</div>
<div style="background:#efe9dd;border:1px solid #d9d2c3;padding:30px 32px;display:flex;flex-direction:column;gap:8px">
<p style="font-size:24px;letter-spacing:4px;text-transform:uppercase;color:#7a5c2c;font-weight:500">Ficou na empresa</p>
<p style="font-family:'Cormorant Garamond', Georgia, serif;font-size:80px;font-weight:600;line-height:1;color:#7a5c2c">≈ 500 €</p>
<p style="font-size:24px;line-height:1.35;color:#3a3f4b">depois de energia, pedágio e estacionamento</p>
</div>
<p style="font-size:24px;line-height:1.4;color:#6b6f7a">A mesa só entra no voucher depois do sim do restaurante. Nunca prometemos antes.</p>
</div>
</div>
<div style="position:absolute;left:128px;right:128px;bottom:64px;display:flex;justify-content:space-between"><p style="font-size:24px;color:#6b6f7a">The World Keys · Balcão Aria · 16 de outubro de 2026</p><p style="font-size:24px;color:#6b6f7a">3 / 9</p></div>
</section></div>
<figcaption><span>Slide 3 de 9</span><span>The World Keys</span></figcaption>
<details><summary>Notas do apresentador</summary><p>1 min 30. Conte como uma história. O ponto a fixar: a mesma mensagem do concierge gera dois serviços, e a Aria só fala em valor fechado depois dos dois sins (restaurante e chauffeur). &quot;Ficou na empresa&quot; é contribuição depois do custo variável; o fixo do carro e do chauffeur aparece no slide 5. O cartão no balcão do hotel é o vendedor de campo sem custo.</p></details>
</figure>
<figure id="vendemos">
<div class="tela"><section id="vendemos" data-transition="fade" style="background:#f7f4ef;color:#1f232c;font-family:'Jost', Arial, sans-serif;padding:128px 128px 160px;display:flex;flex-direction:column;justify-content:space-between;gap:30px">
<div style="display:flex;flex-direction:column;gap:14px">

<h2 style="font-family:'Cormorant Garamond', Georgia, serif;font-size:68px;font-weight:500;line-height:1.08">Seis produtos com preço fixo. A Soirée é o principal; o resto combina com ela.</h2>
</div>
<div style="display:flex;gap:28px;align-items:start">

<tr style="background:#efe9dd"><td style="font-weight:500">Soirée</td><td>Leva ao restaurante, espera até 4 h, traz de volta. Mesa pedida pela Aria.</td><td style="text-align:right">390 €</td></tr>

<tr style="background:#efe9dd"><td style="font-weight:500">Disposição 4 h</td><td>Carro à disposição em Paris</td><td style="text-align:right">400 €</td></tr>
<tr><td style="font-weight:500">Navette de salão</td><td>Hotel ↔ feira, ida e volta com espera</td><td style="text-align:right">400 €</td></tr>

</table>
<div style="flex:1;display:flex;flex-direction:column;gap:16px">
<div style="background:#141821;padding:26px 30px;display:flex;flex-direction:column;gap:8px">
<p style="font-size:24px;letter-spacing:4px;text-transform:uppercase;color:#e4c990;font-weight:500">Exemplo de pacote</p>
<p style="font-family:'Cormorant Garamond', Georgia, serif;font-size:40px;font-weight:600;line-height:1.1;color:#ede9df">Chegada completa: transfer + mesa na primeira noite</p>
<p style="font-size:25px;line-height:1.4;color:#b5b1a7">540 € ao hóspede. É o mais fácil de vender a um hotel.</p>
</div>
<div style="background:#efe9dd;border:1px solid #d9d2c3;padding:26px 30px;display:flex;flex-direction:column;gap:8px">
<p style="font-size:24px;letter-spacing:4px;text-transform:uppercase;color:#7a5c2c;font-weight:500">Exemplo de conta mensal</p>
<p style="font-family:'Cormorant Garamond', Georgia, serif;font-size:40px;font-weight:600;line-height:1.1">Um hotel: 4 transfers + 2 Soirées por mês</p>
<p style="font-size:25px;line-height:1.4;color:#3a3f4b">1.380 € faturados, cerca de 1.130 € na empresa. Fatura única, concierge recebe 10 %.</p>
</div>
<p style="font-size:24px;line-height:1.4;color:#6b6f7a">Quem é profissional (hotel, villa, agência) paga 10 % a menos. A Aria nunca negocia preço: só escolhe o produto.</p>
</div>
</div>
<div style="position:absolute;left:128px;right:128px;bottom:64px;display:flex;justify-content:space-between"><p style="font-size:24px;color:#6b6f7a">The World Keys · Balcão Aria · 16 de outubro de 2026</p><p style="font-size:24px;color:#6b6f7a">4 / 9</p></div>
</section></div>
<figcaption><span>Slide 4 de 9</span><span>The World Keys</span></figcaption>
<details><summary>Notas do apresentador</summary><p>45 s. Não leia a tabela: diga « seis produtos, preço fixo, a Soirée é o principal ». Os dois exemplos à direita são o que o concierge compra na prática: a chegada completa para abrir a conta, e a conta mensal como meta. Preços TTC com pedágio e espera incluídos; noite, longa distância, Riviera e dois carros são sob orçamento. Tabela proposta em 09/10, aguarda aprovação.</p></details>
</figure>
<figure id="entra">
<div class="tela"><section id="entra" data-transition="fade" style="background:#f7f4ef;color:#1f232c;font-family:'Jost', Arial, sans-serif;padding:128px 128px 160px;display:flex;flex-direction:column;justify-content:space-between;gap:32px">

<div style="position:relative;width:1120px;height:30px;background:#e6e0d3"><div style="position:absolute;left:0;top:0;width:634px;height:30px;background:#c9a96e"></div><div style="position:absolute;left:494px;top:0;width:4px;height:30px;background:#141821"></div></div>

<div style="position:relative;width:1120px;height:30px;background:#e6e0d3"><div style="position:absolute;left:0;top:0;width:1115px;height:30px;background:#9e7c48"></div><div style="position:absolute;left:494px;top:0;width:4px;height:30px;background:#141821"></div></div>

<p style="font-size:24px;line-height:1.4;color:#6b6f7a">O que sobra por mês depois de energia, pedágio e estacionamento. A linha preta é o que o carro e o chauffeur já custam hoje: cerca de 5.300 €.</p>
</div>
<div style="flex:1;display:flex;flex-direction:column;gap:16px">
